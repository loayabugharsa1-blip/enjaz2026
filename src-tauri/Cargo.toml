[package]
name = "injaz"
version = "2.2.0"
description = "إنجاز للدعاية و الاعلان - نظام إدارة متكامل"
authors = ["Enjaz"]
edition = "2021"

[lib]
name = "injaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
